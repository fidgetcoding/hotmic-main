# Hot Mic for iPhone: the singer's side of a Hot Mic Session. Generate with `xcodegen generate`.
name: HotMicRemote
options:
  bundleIdPrefix: io.bluegum
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
packages:
  SessionKit:
    path: ../SessionKit
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  HotMicRemote:
    type: application
    platform: iOS
    sources:
      - path: HotMicRemote
    dependencies:
      - package: SessionKit
        product: SessionKit
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.bluegum.hotmic.remote
        PRODUCT_NAME: HotMicRemote
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: HotMicRemote/Info.plist
      properties:
        CFBundleDisplayName: Hot Mic
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Hot Mic sends your humming and singing to the producer's session.
        NSCameraUsageDescription: Hot Mic scans the QR code on the producer's Mac to join the session.
        NSLocalNetworkUsageDescription: Hot Mic finds sessions on this network and sends your takes to them.
        NSBonjourServices: [_hotmic._tcp]
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: io.bluegum.hotmic.join
            CFBundleURLSchemes: [hotmic]
