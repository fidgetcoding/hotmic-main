name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: swift build
      # Tests that use the mic, the network or local files are opt-in through HM_* variables, none set here.
      - name: Test
        run: swift test
      - name: Test the window's judge code
        run: node --test Tests/lab/judge.test.mjs
