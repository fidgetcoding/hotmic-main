<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hot Mic flame border</title>
<style>
  :root { --bg: #121016; --ink: #ece8f4; --dim: #8d86a0; --card: #1b1822; --line: #2c2836; --pick: #c9b8ff; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, system-ui, sans-serif; padding: 28px 16px 40px; }
  h1 { font-size: 20px; margin: 0 0 4px; } p.lede { color: var(--dim); margin: 0 0 22px; max-width: 820px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(560px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; cursor: pointer; }
  .card.on { border-color: var(--pick); box-shadow: 0 0 0 2px var(--pick) inset; }
  .card h2 { font-size: 16px; margin: 0 0 2px; } .why, .mb { color: var(--dim); font-size: 12.5px; margin-bottom: 10px; }
  .mb { margin: 8px 0 0; }
  .sizes { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
  .sizes figure { margin: 0; text-align: center; color: var(--dim); font-size: 11px; }
  .lt { background: #e9e7ec; border-radius: 10px; padding: 6px; }
  .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .menubar { display: flex; align-items: center; gap: 14px; height: 26px; padding: 0 12px; border-radius: 6px; font-size: 11px; }
  .menubar.light { background: #e9e7ec; color: #222; } .menubar.dark { background: #1d1d20; color: #ddd; }
</style>
</head><body>
<h1>The frame is on fire</h1>
<p class="lede">Nate (2026-10-14): the H stays clean; the flame lives in the icon's border as negative space. Six takes, each at icon, 128, 32 and 16 px (on dark and light), plus the menu-bar template. Click a card to choose it.</p>
<div class="grid" id="grid"></div>
<script>
const HPATH = "M1951 1427H1964Q1970 1427 1971.5 1426.0Q1973 1425 1975.5 1424.5Q1978 1424 1980 1422Q1985 1418 1994 1413Q2006 1404 2006.0 1392.0Q2006 1380 1982.5 1342.5Q1959 1305 1862 1156Q1638 813 1461 520Q1155 11 1152.0 8.0Q1149 5 1148 2Q1147 -4 1140 -4L1126 -1L1099 -8L1083 -5L1066 -8H1060L1004 -16Q954 -16 954 18Q954 32 963 53Q994 126 1275 584Q1090 579 910 579L695 580Q642 495 550 339Q351 -1 338.0 -4.5Q325 -8 317.0 -8.0Q309 -8 302.0 1.5Q295 11 292.5 11.0Q290 11 282.0 7.0Q274 3 259 3L236 4L227 10Q226 10 224.5 7.0Q223 4 217 4Q174 4 174 40Q174 64 191.0 103.0Q208 142 235.5 188.0Q263 234 377.5 405.5Q492 577 492 578Q473 579 448 580Q397 580 376 584Q319 594 298 678Q287 719 288 732Q288 759 311 759L337 752Q357 751 433.0 747.0Q509 743 542 743L599 745Q729 949 910 1206Q778 1098 617 1098Q541 1098 486.0 1134.5Q431 1171 431.0 1227.0Q431 1283 473.0 1315.5Q515 1348 553.0 1348.0Q591 1348 591 1336Q591 1332 580.5 1327.0Q570 1322 570 1317Q570 1301 605.0 1288.5Q640 1276 683.5 1276.0Q727 1276 791.0 1301.5Q855 1327 924 1367Q1020 1423 1076 1460Q1108 1476 1136.0 1476.0Q1164 1476 1176.5 1469.5Q1189 1463 1195.0 1456.5Q1201 1450 1208.0 1439.5Q1215 1429 1221.5 1423.5Q1228 1418 1228.0 1411.0Q1228 1404 1220.5 1389.0Q1213 1374 1144.0 1267.5Q1075 1161 966.5 995.5Q858 830 808 752Q1075 752 1385 762Q1762 1357 1783.0 1386.0Q1804 1415 1821.0 1424.0Q1838 1433 1863 1433Z";
// One flame silhouette: a tall center tongue with two shorter side tongues, base on y, tips pointing up.
const flame = (cx, y, h, w) => `M${cx-w} ${y} C${cx-w} ${y-h*.3} ${cx-w*.8} ${y-h*.45} ${cx-w*.62} ${y-h*.62}
  C${cx-w*.55} ${y-h*.45} ${cx-w*.42} ${y-h*.4} ${cx-w*.3} ${y-h*.42} C${cx-w*.32} ${y-h*.7} ${cx-w*.1} ${y-h*.85} ${cx+w*.05} ${y-h}
  C${cx+w*.1} ${y-h*.75} ${cx+w*.3} ${y-h*.6} ${cx+w*.3} ${y-h*.45} C${cx+w*.42} ${y-h*.5} ${cx+w*.55} ${y-h*.6} ${cx+w*.62} ${y-h*.72}
  C${cx+w*.78} ${y-h*.5} ${cx+w} ${y-h*.3} ${cx+w} ${y} Z`;
const TILE = 'M285 100 H739 A185 185 0 0 1 924 285 V739 A185 185 0 0 1 739 924 H285 A185 185 0 0 1 100 739 V285 A185 185 0 0 1 285 100 Z';
// The rim ring as a path whose top edge rises into a flame (take 6).
const RING_FLAME = 'M300 160 H420 C440 160 452 150 462 128 C470 112 478 104 486 96 C484 120 494 132 502 120 C512 102 520 80 530 56 C540 86 548 108 560 122 C568 110 574 100 582 92 C588 118 590 140 604 160 H724 A140 140 0 0 1 864 300 V724 A140 140 0 0 1 724 864 H300 A140 140 0 0 1 160 724 V300 A140 140 0 0 1 300 160 Z';

const DEFS = `<linearGradient id="chrome" gradientUnits="userSpaceOnUse" x1="0" y1="352" x2="0" y2="666">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".4" stop-color="#dfe5ff"/><stop offset=".56" stop-color="#8f9cff"/>
    <stop offset=".76" stop-color="#eef0ff"/><stop offset="1" stop-color="#b4c4ff"/></linearGradient>
  <linearGradient id="chromeF" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#8f9cff"/><stop offset=".5" stop-color="#dfe5ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  <linearGradient id="rimG" gradientUnits="userSpaceOnUse" x1="0" y1="40" x2="0" y2="864"><stop offset="0" stop-color="#ffffff"/><stop offset=".12" stop-color="#dfe5ff"/><stop offset=".3" stop-color="#8f9cff"/><stop offset="1" stop-color="#b4c4ff"/></linearGradient>
  <radialGradient id="tile" cx=".5" cy="0" r="1.1"><stop offset="0" stop-color="#2a2533"/><stop offset="1" stop-color="#120f17"/></radialGradient>
  <filter id="lift" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="2" flood-color="#000" flood-opacity=".6"/></filter>
  <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="leak" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
  <clipPath id="tclip"><path d="${TILE}"/></clipPath>`;
const H = fill => `<g transform="translate(267.0087 664.3886) scale(0.21834)" fill="${fill}"${fill.startsWith('url') ? ' filter="url(#lift)"' : ''}><path transform="scale(1 -1)" d="${HPATH}"/></g>`;
const dot = `<circle cx="712" cy="712" r="57" fill="#8fe2ff" opacity=".55" filter="url(#glow)"/><circle cx="712" cy="712" r="26" fill="#8fe2ff"/>`;
const ring = (extra = '') => `<rect x="160" y="160" width="704" height="704" rx="140" fill="none" stroke="#c9b98a" stroke-width="15"${extra}/>
  <rect x="181" y="181" width="662" height="662" rx="123" fill="none" stroke="#c9b98a" stroke-opacity=".45" stroke-width="5"${extra}/>`;
const mask = (id, cuts) => `<mask id="${id}" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><rect width="1024" height="1024" fill="#fff"/>${cuts.map(d => `<path d="${d}" fill="#000"/>`).join('')}</mask>`;

const NOTCH = flame(512, 300, 250, 105), RINGCUT = flame(512, 290, 200, 80), CORNER = 'M924 470 C860 440 820 400 810 330 C780 360 740 360 712 345 C740 300 730 240 690 200 C740 205 770 190 780 150 C800 180 820 190 830 175 C830 140 810 120 800 100 L924 100 Z';
const RISE = flame(512, 150, 200, 120), LEAK = flame(512, 330, 260, 130);
const TAKES = [
  { name: "Flame notch in the top edge", why: "A flame silhouette is bitten out of the tile's top edge and through the gold rim, so the background shows through as fire.",
    mb: "Menu bar: the tile becomes a solid rounded square with the notch cut in its top and the H knocked out of it.",
    art: () => `<defs>${mask('m1', [NOTCH])}</defs><g mask="url(#m1)"><path d="${TILE}" fill="url(#tile)"/>${ring()}</g>`,
    mono: c => `<defs>${mask('k1', [NOTCH])}<mask id="h1"><rect width="1024" height="1024" fill="#fff"/>${H('#000')}</mask></defs><g mask="url(#k1)"><path d="${TILE}" fill="${c}" mask="url(#h1)"/></g>` },
  { name: "Flame gap in the rim", why: "The tile stays whole; only the gold rim ring breaks at the top, and it traces around a flame shape instead of running straight.",
    mb: "Menu bar: a thin rounded-square outline with the flame traced into its top, H filled inside.",
    art: () => `<defs>${mask('m2', [RINGCUT])}</defs><path d="${TILE}" fill="url(#tile)"/><g mask="url(#m2)">${ring()}</g><path d="${RINGCUT}" fill="none" stroke="#c9b98a" stroke-width="12" stroke-linejoin="round"/>`,
    mono: c => `<defs>${mask('k2', [RINGCUT])}</defs><rect x="160" y="160" width="704" height="704" rx="140" fill="none" stroke="${c}" stroke-width="48" mask="url(#k2)"/><path d="${RINGCUT}" fill="none" stroke="${c}" stroke-width="40" stroke-linejoin="round"/>${H(c)}` },
  { name: "Top edge rises into flame", why: "The tile's own silhouette grows a flame out of its top edge, like the frame itself is burning upward. Tile shrinks a touch to make room.",
    mb: "Menu bar: the solid silhouette with the flame crown on top, H knocked out.",
    shrink: true,
    art: () => `<path d="${TILE} ${RISE}" fill="url(#tile)"/><path d="${RISE}" fill="url(#tile)"/>${ring()}`,
    mono: c => `<defs><mask id="h3"><rect width="1024" height="1024" fill="#fff"/>${H('#000')}</mask></defs><g mask="url(#h3)"><path d="${TILE}" fill="${c}"/><path d="${RISE}" fill="${c}"/></g>`, noH: true },
  { name: "Corner on fire", why: "The top-right corner is eaten away by flame licks, the rounded corner replaced by tongues of negative space.",
    mb: "Menu bar: the solid square with the burnt top-right corner, H knocked out.",
    art: () => `<defs>${mask('m4', [CORNER])}</defs><g mask="url(#m4)"><path d="${TILE}" fill="url(#tile)"/>${ring()}</g>`,
    mono: c => `<defs>${mask('k4', [CORNER])}<mask id="h4"><rect width="1024" height="1024" fill="#fff"/>${H('#000')}</mask></defs><g mask="url(#k4)"><path d="${TILE}" fill="${c}" mask="url(#h4)"/></g>` },
  { name: "Light leak at the edge", why: "Chrome light bleeds in through the top rim in a flame shape and fades into the dark tile; the rim breaks where the light gets in.",
    mb: "Menu bar: a glow can't be a template, so it falls back to take 1's notch silhouette.",
    art: () => `<defs>${mask('m5', [flame(512, 290, 210, 85)])}</defs><path d="${TILE}" fill="url(#tile)"/><g mask="url(#m5)">${ring()}</g>
      <g clip-path="url(#tclip)"><path d="${LEAK}" fill="url(#chromeF)" opacity=".55" filter="url(#leak)"/><path d="${flame(512, 290, 210, 85)}" fill="url(#chromeF)" opacity=".35"/></g>`,
    mono: c => `<defs>${mask('k5', [NOTCH])}<mask id="h5"><rect width="1024" height="1024" fill="#fff"/>${H('#000')}</mask></defs><g mask="url(#k5)"><path d="${TILE}" fill="${c}" mask="url(#h5)"/></g>` },
  { name: "Chrome rim draws a flame", why: "The rim ring switches from gold to the H's chrome gradient and its top line rises into a flame outline, so the frame and the H share one material.",
    mb: "Menu bar: the outline ring with its flame peak, H filled inside.",
    art: () => `<path d="${TILE}" fill="url(#tile)"/><path d="${RING_FLAME}" fill="none" stroke="url(#rimG)" stroke-width="15" stroke-linejoin="round" filter="url(#lift)"/>`,
    mono: c => `<path d="${RING_FLAME}" fill="none" stroke="${c}" stroke-width="44" stroke-linejoin="round"/>${H(c)}` },
];
const svg = (t, body, vb = '0 0 1024 1024') => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}"><defs>${DEFS}</defs>${body}</svg>`;
const full = t => svg(t, `<g${t.shrink ? ' transform="translate(512 600) scale(.84) translate(-512 -560)"' : ''}>${t.art()}${H('url(#chrome)')}${dot}</g>`);
const mono = (t, c) => svg(t, t.mono(c), '80 30 864 910');
const url = s => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
const img = (s, px) => `<img src="${url(s)}" width="${px}" height="${px}" alt="">`;
const grid = document.getElementById('grid'), pick = new URLSearchParams(location.search).get('pick');
TAKES.forEach((t, i) => {
  const n = i + 1, f = full(t), c = document.createElement('div');
  c.className = 'card' + (pick == n ? ' on' : '');
  c.innerHTML = `<h2>${n}. ${t.name}</h2><div class="why">${t.why}</div>
    <div class="sizes">${[[220,'icon'],[128,'128'],[32,'32'],[16,'16']].map(([p,l]) => `<figure>${img(f,p)}<figcaption>${l}</figcaption></figure>`).join('')}
      <figure class="lt">${img(f,128)}${img(f,32)}${img(f,16)}<figcaption style="color:#555">on light</figcaption></figure></div>
    <div class="row"><div class="menubar light">${img(mono(t,'#000'),22)}${img(mono(t,'#000'),16)}<span>template 22 / 16</span></div>
      <div class="menubar dark">${img(mono(t,'#fff'),22)}${img(mono(t,'#fff'),16)}<span>template 22 / 16</span></div></div>
    <div class="mb">${t.mb}</div>`;
  c.onclick = () => { history.replaceState(null, '', '?pick=' + n); document.querySelectorAll('.card').forEach(x => x.classList.remove('on')); c.classList.add('on'); };
  grid.appendChild(c);
});
</script>
</body></html>
