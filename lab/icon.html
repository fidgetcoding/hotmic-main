<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hot Mic Icon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yellowtail&family=Geist:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #12100d; color: #ece6dc; font: 14px/1.4 Geist, -apple-system, sans-serif; }
  header { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 14px; padding: 16px 24px; background: rgba(18,16,13,.93); border-bottom: 1px solid #2a251e; }
  header b { font-size: 18px; } header span { color: #9b958a; } header .grow { flex: 1; }
  .btn { padding: 7px 14px; border-radius: 8px; border: 1px solid #3a3329; background: #1d1a15; color: #ece6dc; font: inherit; cursor: pointer; text-decoration: none; }
  .btn.primary { background: linear-gradient(180deg, #eef0ff, #b4c4ff); color: #141026; border: 0; font-weight: 600; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 18px; padding: 22px 24px 60px; }
  .card { border: 1px solid #2a251e; border-radius: 14px; overflow: hidden; background: #17140f; }
  .card.starred { border-color: #b4c4ff; box-shadow: 0 0 0 1px #b4c4ff, 0 0 24px -8px #b4c4ff; }
  .stage { display: flex; align-items: flex-end; justify-content: center; gap: 22px; padding: 28px 16px 22px; }
  .stage.dock-dark { background: radial-gradient(120% 120% at 50% 0%, #2a2533, #0d0b10); }
  .stage.dock-light { background: linear-gradient(180deg, #ecebf0, #d5d3dc); }
  .meta { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid #2a251e; }
  .meta .n { font: 600 11px ui-monospace, monospace; color: #9b958a; } .meta b { font-size: 15px; } .meta p { margin: 2px 0 0; color: #9b958a; font-size: 12.5px; }
  .meta .txt { flex: 1; }
  .star { width: 38px; height: 38px; border-radius: 10px; border: 1px solid #3a3329; background: #1d1a15; color: #9b958a; font-size: 18px; cursor: pointer; }
  .starred .star { background: #b4c4ff; color: #141026; border-color: #b4c4ff; }
  .menus { display: flex; gap: 10px; padding: 0 16px 14px; }
  .mb { display: flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 6px; background: #e9e9e9; color: #111; font-size: 12px; }
  .mb.dk { background: #2a2a2c; color: #eee; }
  .mb .g { font: 400 17px/1 Yellowtail; }
  /* ---- the icon: a macOS squircle at any size ---- */
  .ic { --s: 128px; width: var(--s); height: var(--s); border-radius: 22.5%; position: relative; overflow: hidden; flex: none; box-shadow: 0 calc(var(--s) * .06) calc(var(--s) * .12) rgba(0,0,0,.45); }
  .ic.s64 { --s: 64px; } .ic.s32 { --s: 32px; }
  .ic .t { font-family: Yellowtail, cursive; line-height: 1; white-space: nowrap; background: linear-gradient(180deg, #ffffff 0%, #dfe5ff 40%, #8f9cff 56%, #eef0ff 76%, #b4c4ff 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 calc(var(--s) * .012) 0 rgba(0,0,0,.65)); }
  .tolex { background: repeating-linear-gradient(45deg, rgba(255,255,255,.045) 0 2px, transparent 2px 4px), radial-gradient(120% 100% at 50% 0%, #2a2533, #120f17); }
  .pipe { position: absolute; inset: 7%; border-radius: 17%; box-shadow: inset 0 0 0 calc(var(--s) * .018) #c9b98a, inset 0 0 0 calc(var(--s) * .03) rgba(0,0,0,.6), inset 0 0 0 calc(var(--s) * .038) rgba(201,185,138,.45); }
  .center { position: absolute; inset: 0; display: grid; place-items: center; }
  .gloss::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.14), transparent 45%); pointer-events: none; }
  .rose { background: linear-gradient(90deg, rgba(0,0,0,.25), transparent 30%, transparent 70%, rgba(0,0,0,.3)), url(textures/cab-rosewood.jpg) center/cover, #4a2318; }
  .strip { position: absolute; left: 0; right: 0; top: 30%; height: 40%; background: repeating-linear-gradient(45deg, rgba(255,255,255,.045) 0 2px, transparent 2px 4px), #17141c; box-shadow: 0 calc(var(--s) * -.012) 0 #c9b98a, 0 calc(var(--s) * .012) 0 #c9b98a, 0 calc(var(--s) * .03) calc(var(--s) * .05) rgba(0,0,0,.6); display: grid; place-items: center; }
  .enamel { background: radial-gradient(120% 90% at 50% 0%, #d7deff 0%, #9aa8f2 55%, #6f7bd0 100%); }
  .enamel .t { background: linear-gradient(180deg, #2a2655, #141127); -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 1px 0 rgba(255,255,255,.6)); }
  .swoosh { position: absolute; left: 20%; right: 18%; bottom: 23%; height: calc(var(--s) * .035); border-radius: 99px; background: linear-gradient(90deg, transparent, #c9b98a 18%, #eadfba 60%, #8fe2ff 92%); }
  .dot { position: absolute; right: 16%; bottom: 20%; width: calc(var(--s) * .07); height: calc(var(--s) * .07); border-radius: 50%; background: #8fe2ff; box-shadow: 0 0 calc(var(--s) * .06) #8fe2ff; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 9px 16px; border-radius: 999px; background: #eef0ff; color: #141026; font-weight: 600; }

  .hsvg { position: absolute; inset: 0; display: grid; place-items: center; }
  .hsvg svg { width: 62%; height: 62%; overflow: visible; filter: drop-shadow(0 calc(var(--s) * .012) 0 rgba(0,0,0,.65)); }
  .adapt-note { padding: 0 16px 10px; color: #9b958a; font-size: 12px; }
</style>
</head>
<body>
<header><b>Hot Mic · app icon</b><span>For the Chrome script logo. Each shown at Dock size, 64 and 32, on dark and light. ☆ the ones you like.</span><div class="grow"></div><button class="btn primary" id="copy">Copy picks</button><a class="btn" href="logo.html">← Logos</a></header>
<main id="grid"></main>
<script>
const fs = (k) => `calc(var(--s) * ${k})`;
const ICONS = [
  { id: 'badge', adaptive: true, name: 'Mini nameplate', why: 'The full "Hot Mic" chrome script inside a gold-piped tolex tile, like the badge shrunk onto the app.', menu: 'Hm',
    html: () => `<div class="ic tolex gloss"><div class="pipe"></div><div class="center"><span class="t" style="font-size:${fs(0.25)};transform:rotate(-6deg)">Hot Mic</span></div></div>` },
  { id: 'hm', name: 'Script Hm', why: 'A big chrome "Hm" with a gold swoosh that ends in the lit dot: reads at every size.', menu: 'Hm',
    html: () => `<div class="ic tolex gloss"><div class="pipe"></div><div class="center"><span class="t" style="font-size:${fs(0.56)};margin-top:-8%">Hm</span></div><div class="swoosh"></div><div class="dot"></div></div>` },
  { id: 'stacked', name: 'Stacked', why: '"Hot" over "Mic" in chrome script, filling the tile like a guitar headstock.', menu: 'Hm',
    html: () => `<div class="ic tolex gloss"><div class="pipe"></div><div class="center" style="align-content:center;gap:0"><span class="t" style="font-size:${fs(0.3)};display:block;margin-left:-14%;padding-right:6%">Hot</span><span class="t" style="font-size:${fs(0.3)};display:block;margin:-10% 0 0 16%">Mic</span></div></div>` },
  { id: 'rosestrip', name: 'Rosewood strip', why: 'The rosewood cabinet with the tolex name strip running across it, the app window in one tile.', menu: 'Hm',
    html: () => `<div class="ic rose gloss"><div class="strip"><span class="t" style="font-size:${fs(0.26)}">Hot Mic</span></div></div>` },
  { id: 'enamel', name: 'Lilac enamel', why: 'A lilac enamel tile with the script pressed in dark, the colorway doing the talking.', menu: 'Hm',
    html: () => `<div class="ic enamel gloss"><div class="center"><span class="t" style="font-size:${fs(0.5)};margin-top:-6%">Hm</span></div></div>` },
  { id: 'hscript', name: 'Big H + piping', why: 'One oversized chrome script H, the gold piping and a lit dot. Simplest silhouette in the Dock.', menu: 'H',
    html: () => `<div class="ic tolex gloss"><div class="pipe"></div><div class="center"><span class="t" style="font-size:${fs(0.74)};margin:-10% 0 0 -6%">H</span></div><div class="dot" style="right:20%;bottom:24%"></div></div>` },
];

// Script H, fitted to its actual ink (the glyph's flourish makes its text box off-center).
const H_SVG = (id) => `<div class="hsvg"><svg data-fit viewBox="0 0 100 100"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".4" stop-color="#dfe5ff"/><stop offset=".56" stop-color="#8f9cff"/><stop offset=".76" stop-color="#eef0ff"/><stop offset="1" stop-color="#b4c4ff"/></linearGradient></defs><text x="0" y="80" font-family="Yellowtail" font-size="100" fill="url(#${id})">H</text></svg></div>`;
let hid = 0;
const smallH = (dot) => `<div class="ic tolex gloss"><div class="pipe"></div>${H_SVG('hg' + (hid++))}${dot ? '<div class="dot" style="right:22%;bottom:22%"></div>' : ''}</div>`;
function fitAll() {
  document.querySelectorAll('svg[data-fit]').forEach((svg) => {
    const t = svg.querySelector('text'), b = t.getBBox && t.getBBox();
    if (!b || !b.width) return;
    // measure the ink, not the em box: rasterize once and scan for painted pixels
    const c = document.createElement('canvas'), W = 300; c.width = W; c.height = W; const g = c.getContext('2d');
    g.font = `${W * 0.7}px Yellowtail`; g.textBaseline = 'alphabetic'; g.fillStyle = '#000'; g.fillText('H', W * 0.15, W * 0.75);
    const d = g.getImageData(0, 0, W, W).data; let x0 = W, y0 = W, x1 = 0, y1 = 0;
    for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) if (d[(y * W + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    const k = 100 / (W * 0.7), ix = (x0 - W * 0.15) * k, iy = (y0 - W * 0.75) * k + 80, iw = (x1 - x0) * k, ih = (y1 - y0) * k;
    const side = Math.max(iw, ih) * 1.06, cx = ix + iw / 2, cy = iy + ih / 2;
    svg.setAttribute('viewBox', `${cx - side / 2} ${cy - side / 2} ${side} ${side}`);
  });
}
const KEY = 'hotmicIcon'; let stars = []; try { stars = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) {}
const size = (h, cls) => h.replace('class="ic ', `class="ic ${cls} `);
const row = (it, dot) => it.adaptive ? `${it.html()}${size(smallH(dot), 's64')}${size(smallH(dot), 's32')}` : `${it.html()}${size(it.html(), 's64')}${size(it.html(), 's32')}`;
function render() {
  document.getElementById('grid').innerHTML = ICONS.map((it, i) => `
    <section class="card${stars.includes(it.id) ? ' starred' : ''}" data-id="${it.id}">
      <div class="stage dock-dark">${row(it, false)}</div>
      <div class="stage dock-light">${row(it, false)}</div>${it.adaptive ? `<div class="stage dock-dark">${size(smallH(false), 's64').replace('s64', '')}${size(smallH(false), 's64')}${size(smallH(false), 's32')}${size(smallH(true), 's64')}${size(smallH(true), 's32')}</div><div class="adapt-note">Full name in the Dock; the centered H takes over at 64 and below (right two: with the lit dot).</div>` : ''}
      <div class="menus"><div class="mb"><span class="g">${it.menu}</span>menu bar</div><div class="mb dk"><span class="g">${it.menu}</span>menu bar</div></div>
      <div class="meta"><span class="n">${String(i + 1).padStart(2, '0')}</span><div class="txt"><b>${it.name}</b><p>${it.why}</p></div><button class="star">${stars.includes(it.id) ? '★' : '☆'}</button></div>
    </section>`).join('');
  document.querySelectorAll('.star').forEach((b) => b.addEventListener('click', () => { const id = b.closest('.card').dataset.id; stars = stars.includes(id) ? stars.filter((x) => x !== id) : [...stars, id]; try { localStorage.setItem(KEY, JSON.stringify(stars)); } catch (e) {} render(); }));
}
render();
(document.fonts ? document.fonts.load('100px Yellowtail').then(() => document.fonts.ready) : Promise.resolve()).then(fitAll);
const _render = render; render = () => { _render(); fitAll(); };
document.getElementById('copy').addEventListener('click', async () => {
  const txt = `Hot Mic icon picks: ${stars.map((id) => ICONS.find((x) => x.id === id).name).join(', ') || 'none yet'}`;
  try { await navigator.clipboard.writeText(txt); } catch (e) { console.log(txt); }
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = 'Copied. Paste it to Claude.'; document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
});
</script>
</body>
</html>
