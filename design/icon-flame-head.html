<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flame Head Note</title>
<style>
  :root { --bg:#f6f4ef; --ink:#1d1d1f; --muted:#6e6e73; --line:#e4e0d8; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system, BlinkMacSystemFont, sans-serif; }
  main { max-width:1180px; margin:0 auto; padding:28px 16px 48px; }
  h1 { font-size:24px; margin:0 0 4px; } p.sub { color:var(--muted); margin:0 0 22px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(420px,1fr)); gap:18px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:18px; padding:18px 20px; }
  .card h2 { font-size:17px; margin:0 0 12px; }
  .big { display:flex; gap:16px; align-items:center; }
  .glyph { width:110px; height:110px; color:var(--ink); }
  .app { width:130px; height:130px; filter:drop-shadow(0 6px 14px rgba(0,0,0,.18)); }
  .bar { display:flex; align-items:center; gap:14px; height:30px; padding:0 14px; border-radius:8px; margin-top:10px; font-size:12px; }
  .bar.light { background:#ececec; color:#111; } .bar.dark { background:#2a2a2c; color:#f2f2f2; }
  .bar svg { width:19px; height:19px; }
  .priv { width:30px; height:22px; border-radius:11px; background:#f19a37; display:grid; place-items:center; }
  .priv svg { width:14px; height:14px; color:#fff; }
  .lbl { margin-left:auto; opacity:.6; }
</style></head><body><main>
<h1>Flame-head note</h1>
<p class="sub">The note head is a flame; the stem stays a stem. Flag: regular, or a flame.</p>
<svg width="0" height="0" style="position:absolute"><defs>
  <path id="head" d="M8.3 10.6c.7 2 3.7 3.1 3.8 6 .1 2.5-1.8 4.3-4 4.3-2.4 0-4.3-1.7-4.1-4.2.1-1.6 1.1-2.5 1.5-3.9.8.8 1 1.7.9 2.6 1.1-1 1.7-2.8 1.9-4.8z"/>
  <path id="stem" d="M10.55 17.3V3h1.65v14.3z"/>
  <path id="flag" d="M12.2 3c.2 1.9 1.4 3.2 2.9 4.3 1.6 1.2 2.7 2.9 2.1 5.7-.3-1.8-1.3-3-2.7-3.8-.8-.5-1.6-.8-2.3-.9z"/>
  <path id="fflag" d="M12.2 9.6V2.4c1.3 1 1.6 2.2 1.4 3.3.9-.7 1.3-1.8 1.2-2.9 1.9 1.4 3.1 3.4 2.6 5.8-.35 1.8-1.8 2.8-3.2 3 .7-1.2.6-2.4-.2-3.1-.1.7-.7 1.2-1.8 1.1z"/>
  <g id="v1"><use href="#head"/><use href="#stem"/><use href="#flag"/></g>
  <g id="v2"><use href="#head"/><use href="#stem"/><use href="#fflag"/></g>
  <g id="dot"><circle cx="20.6" cy="16.8" r="2.4"/></g>
  <g id="sysmic"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M6.3 11.5a5.7 5.7 0 0 0 11.4 0M12 17.2v3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></g>
  <linearGradient id="gum" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f7f86"/><stop offset="1" stop-color="#23474d"/></linearGradient>
  <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff3b14"/><stop offset=".55" stop-color="#ff7a1a"/><stop offset="1" stop-color="#ffd84a"/></linearGradient>
</defs></svg>
<div class="grid" id="grid"></div>
<script>
  const v = [['v1','A · Flame head, regular flag','#flag'],['v2','B · Flame head, flame flag','#fflag']];
  for (const [id, title, flag] of v) {
    const bar = c => `<div class="bar ${c}"><span class="priv"><svg viewBox="0 0 24 24"><use href="#sysmic"/></svg></span>
      <svg viewBox="2.5 1.5 20.5 20.5" fill="currentColor"><use href="#${id}"/></svg><svg viewBox="2.5 1.5 20.5 20.5" fill="currentColor"><use href="#${id}"/><use href="#dot"/></svg><span class="lbl">${c} · off / rec</span></div>`;
    document.getElementById('grid').insertAdjacentHTML('beforeend', `<section class="card"><h2>${title}</h2><div class="big">
      <svg class="glyph" viewBox="2.5 1.5 20.5 20.5" fill="currentColor"><use href="#${id}"/></svg>
      <svg class="app" viewBox="0 0 1024 1024"><rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gum)"/>
        <g transform="translate(170 160) scale(30)"><use href="#head" fill="url(#fire)"/><use href="#stem" fill="#f4efe6"/><use href="${flag}" fill="${flag === '#fflag' ? 'url(#fire)' : '#f4efe6'}"/></g></svg>
      <svg class="app" viewBox="0 0 1024 1024"><rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gum)"/>
        <g transform="translate(170 160) scale(30)" fill="url(#fire)"><use href="#${id}"/></g></svg>
      </div>${bar('light')}${bar('dark')}</section>`);
  }
</script></main></body></html>
