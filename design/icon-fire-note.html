<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fire Note</title>
<style>
  :root { --bg:#f6f4ef; --ink:#1d1d1f; --muted:#6e6e73; --line:#e4e0d8; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system, BlinkMacSystemFont, sans-serif; }
  main { max-width:1000px; margin:0 auto; padding:28px 16px 48px; }
  h1 { font-size:24px; margin:0 0 18px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:18px; padding:20px; }
  .big { display:flex; gap:22px; align-items:center; flex-wrap:wrap; }
  .glyph { width:180px; height:180px; color:var(--ink); }
  .app { width:150px; height:150px; filter:drop-shadow(0 6px 14px rgba(0,0,0,.18)); }
  .bar { display:flex; align-items:center; gap:14px; height:30px; padding:0 14px; border-radius:8px; margin-top:12px; font-size:12px; }
  .bar.light { background:#ececec; color:#111; } .bar.dark { background:#2a2a2c; color:#f2f2f2; }
  .bar svg { width:19px; height:19px; }
  .priv { width:30px; height:22px; border-radius:11px; background:#f19a37; display:grid; place-items:center; }
  .priv svg { width:14px; height:14px; color:#fff; }
</style></head><body><main>
<h1>Fire note</h1>
<svg width="0" height="0" style="position:absolute"><defs>
  <path id="headf" d="M12.1 16.6c.2 2.4-1.5 4.4-4.2 4.4-2.6 0-4.2-1.5-3.9-3.6.2-1.4 1-2.3 1.5-3.4.4.8.6 1.4.5 2 .7-.7 1.1-1.7 1-3.2.9.8 1.4 1.7 1.4 2.5.7-.5 1.1-1.2 1.2-2 1 .7 2.3 1.7 2.5 3.3z"/>
  <path id="stemf" d="M10.5 17.2V2.4c1.4.9 1.9 2.2 1.7 3.4.7-.9 1-1.9.9-3 1.9 1.3 3.5 3.1 3.4 5.6-.1 2-1.5 3.4-3.1 4 .6-1.2.5-2.4-.3-3.1-.1 1-.5 1.6-1.1 1.9v6z"/>
  <g id="fn"><use href="#headf"/><use href="#stemf"/></g>
  <g id="dot"><circle cx="20" cy="17.6" r="2.3"/></g>
  <g id="sysmic"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M6.3 11.5a5.7 5.7 0 0 0 11.4 0M12 17.2v3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></g>
  <linearGradient id="gum" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f7f86"/><stop offset="1" stop-color="#23474d"/></linearGradient>
  <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0" gradientUnits="userSpaceOnUse" gradientTransform="scale(24)"><stop offset="0" stop-color="#ff3b14"/><stop offset=".55" stop-color="#ff7a1a"/><stop offset="1" stop-color="#ffd84a"/></linearGradient>
</defs></svg>
<section class="card"><div class="big">
  <svg class="glyph" viewBox="3 1.6 18.6 20.2" fill="currentColor"><use href="#fn"/></svg>
  <svg class="app" viewBox="0 0 1024 1024"><rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gum)"/>
    <g transform="translate(166 150) scale(31)" fill="url(#fire)"><use href="#fn"/></g></svg>
  <svg class="app" viewBox="0 0 1024 1024"><rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gum)"/>
    <g transform="translate(166 150) scale(31)"><use href="#headf" fill="url(#fire)"/><use href="#stemf" fill="#f4efe6"/></g></svg>
</div>
<div class="bar light"><span class="priv"><svg viewBox="0 0 24 24"><use href="#sysmic"/></svg></span><svg viewBox="3 1.6 18.6 20.2" fill="currentColor"><use href="#fn"/></svg><svg viewBox="3 1.6 20 20.2" fill="currentColor"><use href="#fn"/><use href="#dot"/></svg><span style="margin-left:auto;opacity:.6">off / rec</span></div>
<div class="bar dark"><span class="priv"><svg viewBox="0 0 24 24"><use href="#sysmic"/></svg></span><svg viewBox="3 1.6 18.6 20.2" fill="currentColor"><use href="#fn"/></svg><svg viewBox="3 1.6 20 20.2" fill="currentColor"><use href="#fn"/><use href="#dot"/></svg><span style="margin-left:auto;opacity:.6">off / rec</span></div>
</section></main></body></html>
